spring.application.name=favorite_route
server.port=8086
spring.datasource.url=jdbc:postgresql://postgres:5432/travel_favorite_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG
grpc.client.diary-client.address=static://diary-service:9091
grpc.client.diary-client.negotiation-type=plaintext
